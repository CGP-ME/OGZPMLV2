<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ========================================================================
         OGZPrime Unified Dashboard v2 — Modular-by-Design Shell
         ========================================================================
         Created: 2026-05-06
         Purpose: Production-grade replacement for the monolithic unified-dashboard.html.
                  This file is a THIN SHELL only — no inline panel logic or CSS.
                  All panel behavior lives in public/js/panels/*.js
                  All panel styling lives in public/css/panels/*.css and public/css/*.css

         Deployment: Runs ALONGSIDE the v1 monolith. No overwrite.
                     Both dashboards can be accessed in production.

         Philosophy: A tiny HTML file (~500 lines total) that:
                     1. Imports theme variables + font CDNs (head)
                     2. Provides empty mount-point divs for modules (body)
                     3. Loads all module scripts in order (bottom of body)
                     4. Calls OGZ.init() to boot the system (inline script)

         Future work: As modules are extracted from the monolith, they will be
                      added to this shell. Regions without modules yet are
                      marked with TODO comments + placeholder divs.
         ======================================================================== -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Empty WS-token placeholder. Public dashboard HTML MUST NOT carry
         WEBSOCKET_AUTH_TOKEN; real auth belongs in a gated ticket/session flow. -->
    <meta name="ws-token" content="">

    <title>OGZPrime Unified Dashboard v2</title>

    <!-- TradingView Lightweight Charts v4.1 -->
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>

    <!-- Per-panel CSS imports (existing panels) -->
    <link rel="stylesheet" href="/css/dashboard.css?v=1777847456749">
    <link rel="stylesheet" href="/css/trading-panel.css?v=1777847456749">
    <link rel="stylesheet" href="/css/asset-tf-card.css?v=1777847456749">
    <link rel="stylesheet" href="/css/header-brand.css?v=1777847456749">
    <link rel="stylesheet" href="/css/golden-proximity.css?v=1777847456749">
    <link rel="stylesheet" href="/css/pattern-sparkline.css?v=1777847456749">

    <!-- Per-panel CSS imports (NEW modules) -->
    <link rel="stylesheet" href="/css/panels/news-ticker.css?v=1778198704738">
    <link rel="stylesheet" href="/css/panels/watchlist-strip.css?v=1780007965824">
    <link rel="stylesheet" href="/css/panels/pattern-card.css?v=1778198704762">
    <link rel="stylesheet" href="/css/panels/header-strip.css?v=1778198704766">
    <link rel="stylesheet" href="/css/panels/trai-brain.css?v=1778198704778">
    <link rel="stylesheet" href="/css/panels/open-positions.css?v=1778198704782">
    <link rel="stylesheet" href="/css/panels/chain-of-thought.css?v=1780065267327">
    <link rel="stylesheet" href="/css/panels/equity-curve.css?v=1778198704794">
    <link rel="stylesheet" href="/css/panels/system-health.css?v=1778198704798">
    <link rel="stylesheet" href="/css/panels/live-readouts.css?v=1778198704834">
    <link rel="stylesheet" href="/css/panels/cyberpunk-polish.css?v=1778237687548">

    <!-- Phase 5 refactor — self-rendering chart + edge-analytics modules.
         Replace legacy chart.js + edge-analytics.js DOM-binders. -->
    <link rel="stylesheet" href="/css/panels/chart-panel.css?v=1779627961788">
    <link rel="stylesheet" href="/css/panels/edge-analytics-panel.css?v=1778238729126">
    <!-- Phase 2 — 4-mode layout system (Operator / Trader / Showcase / Streamer).
         Driven by public/js/panels/layout-switcher.js via body.layout-<mode>. -->
    <link rel="stylesheet" href="/css/layouts.css?v=1779548927391">

    <style>
        /* ========================================================================
           THEME VARIABLES & FOUNDATIONAL STYLES
           Copied from unified-dashboard.html (L30-49 + Phase B root block L2384-2399)
           Every panel CSS file references these variables.
           ======================================================================== */

        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=Orbitron:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Core theme palette */
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --bg-panel: rgba(20, 20, 20, 0.9);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;

            /* Version-specific colors */
            --core-color: #00ccff;
            --ml-color: #ffd700;

            --profit-color: #00ff88;
            --loss-color: #ff3366;
            --neutral-color: #8b8b8b;

            --metallic-gradient: linear-gradient(135deg, #c0c0c0 0%, #808080 50%, #c0c0c0 100%);
            --core-gradient: linear-gradient(135deg, #00ccff 0%, #4dddff 50%, #00ccff 100%);
            --ml-gradient: linear-gradient(135deg, #ffd700 0%, #ffed4e 50%, #ffd700 100%);

            /* OGZprime brand palette (Phase B) */
            --brand-red:          #dc2626;
            --brand-red-bright:   #ef4444;
            --brand-red-dim:      #991b1b;
            --brand-red-glow:     rgba(220, 38, 38, 0.55);
            --brand-red-line:     rgba(220, 38, 38, 0.25);

            /* Glass surfaces */
            --glass-bg:           rgba(14, 14, 16, 0.72);
            --glass-bg-strong:    rgba(10, 10, 12, 0.86);
            --glass-border:       rgba(220, 38, 38, 0.14);
            --glass-border-hover: rgba(220, 38, 38, 0.38);
            --glass-shadow:       0 8px 28px rgba(0, 0, 0, 0.55),
                                  0 0 0 1px rgba(220, 38, 38, 0.06) inset;

            /* Resizable rails (driven by rail-resize.js) */
            --left-rail-width: 320px;
            --right-rail-width: 320px;
            --rail-gap: 20px;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            overflow-y: auto;
            min-height: 100vh;
            cursor: auto;
            position: relative;
        }

        html {
            cursor: auto;
        }

        /* Drag handles for resizable rails — driven by rail-resize.js */
        .rail-resize-handle {
            position: fixed;
            top: 100px;
            bottom: 20px;
            width: 6px;
            cursor: col-resize;
            z-index: 99;
            background: transparent;
            transition: background 120ms ease;
        }

        .rail-resize-handle:hover,
        .rail-resize-handle.dragging {
            background: rgba(220, 38, 38, 0.45);
            box-shadow: 0 0 12px rgba(220, 38, 38, 0.35);
        }

        #leftRailResize  { left: calc(var(--left-rail-width) + 12px); }
        #rightRailResize { right: calc(var(--right-rail-width) + 12px); }

        body.rail-dragging,
        body.rail-dragging * {
            user-select: none !important;
            cursor: col-resize !important;
        }

        /* Background gradient effects (from monolith L106-118) */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(255, 215, 0, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(0, 255, 255, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* ========================================================================
           PAGE-LEVEL GRID LAYOUT
           Structural CSS for the main dashboard regions.
           Mount-point divs below map to these regions.
           ======================================================================== */

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* Header strip — will contain brand, status lights, hero price, etc. */
        header#dashHeader {
            height: 66px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 16px;
            flex-shrink: 0;
            z-index: 10;
        }

        /* Watchlist strip — horizontal scrolling multi-ticker panel */
        #watchlistStrip {
            height: 120px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
            padding: 12px;
            overflow-x: auto;
            overflow-y: hidden;
            flex-shrink: 0;
            z-index: 5;
        }

        /* News ticker — horizontal scrolling RTL news events */
        #newsTicker {
            height: 80px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
            padding: 8px 12px;
            overflow-x: auto;
            overflow-y: hidden;
            flex-shrink: 0;
            z-index: 5;
        }

        /* Main content grid: left rail | center | right rail */
        main.dash-main-grid {
            display: grid;
            grid-template-columns: var(--left-rail-width) 1fr var(--right-rail-width);
            gap: var(--rail-gap);
            flex: 1;
            overflow: hidden;
            padding: var(--rail-gap);
            min-height: 0;
        }

        /* Left rail — edge analytics, confidence heatbar, etc. */
        aside.dash-left-rail {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            min-height: 0;
            padding: 0;
        }

        /* Center column — chart, strategy leaderboard, pattern card, readouts, etc. */
        section.dash-center {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            min-height: 0;
            padding: 0;
        }

        /* Chart panel — self-rendered by chart-panel.js (#chartPanel gets
           class .cp-root at mount). #45: this element previously had NO
           sizing rule at all — the old rule here targeted a stale
           #chartContainer ID that no longer exists in the DOM, so the chart
           sat at its min-content height and never filled the center column.
           flex:1 lets it absorb all leftover column height; the strategy
           leaderboard + readouts row keep their own fixed sizes.
           Background/border/radius come from .cp-root in chart-panel.css —
           intentionally NOT duplicated here to avoid a double border. */
        #chartPanel {
            flex: 1 1 auto;
            min-height: 360px;
            overflow: visible;
        }

        /* Strategy Leaderboard now lives in the right rail with performance modules. */

        /* Readouts row: side-by-side live readouts + pattern card */
        .dash-readouts-row {
            display: flex;
            gap: 12px;
            min-height: 120px;
            flex-shrink: 0;
        }

        #liveReadouts {
            flex: 1;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            overflow-y: auto;
        }

        #patternCard {
            flex: 0 0 280px;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            overflow-y: auto;
        }

        /* Right rail — open positions, TRAI brain, size preview, risk gauge, trade log */
        aside.dash-right-rail {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            min-height: 0;
            max-height: calc(100vh - 180px);
            padding: 0;
        }

        /* Right rail mount points */
        #openPositions,
        #edgeAnalyticsPanel,
        #traiBrain,
        #sizePreview,
        #riskGauge,
        #tradeLog,
        #strategyLeaderboard {
            min-height: 80px;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            overflow-y: auto;
            flex: 0 0 auto;
        }

        #edgeAnalyticsPanel,
        #traiBrain {
            max-height: 280px;
            min-height: 160px;
            overflow-y: auto;
        }

        #tradeLog {
            flex: 1;
            min-height: 150px;
        }

        /* Chain of thought — left rail top slot */
        #chainOfThought {
            flex: 1 1 auto;
            min-height: 240px;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            overflow-y: auto;
        }

        /* Bottom row: equity curve + live trade report */
        .dash-bottom-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 12px;
            min-height: 280px;
            flex-shrink: 0;
            border-top: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.4);
        }

        #liveReport {
            min-height: 0;
            overflow-y: auto;
        }

        #equityCurve {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            overflow-y: auto;
            min-height: 0;
        }

        /* Footer: slim system health strip */
        footer.dash-footer {
            min-height: 56px;
            border-top: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            padding: 8px 12px;
            flex-shrink: 0;
            z-index: 10;
        }

        #systemHealth {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            overflow-y: auto;
        }

        /* ========================================================================
           PLACEHOLDER STYLING
           Used for mount-points that don't yet have modules.
           Option B: Show a visual placeholder so gaps are obvious.
           ======================================================================== */

        .v2-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: rgba(160, 160, 160, 0.6);
            font-size: 10px;
            font-weight: 300;
            text-align: center;
            padding: 8px;
        }

        /* Responsive grid for mobile.
           #50 (revised 2026-05-28): the old rule hid both rails entirely at
           ≤1200px, which nuked 60%+ of the dashboard's modules on any tablet.
           That's the "FUBAR" the operator reported. Now we stack the rails
           BELOW the center column so every module stays reachable —
           order: chart-center first (what the operator needs to see),
           then left rail (TRAI brain + reasoning), then right rail
           (positions, edge analytics, etc.). On true phone widths the
           ≤768/≤480 blocks below tighten paddings + sparkline heights. */
        @media (max-width: 1200px) {
            main.dash-main-grid {
                grid-template-columns: 1fr;
            }
            aside.dash-left-rail,
            aside.dash-right-rail {
                display: flex;
                flex-direction: column;
                gap: 8px;
                width: 100%;
                max-width: 100%;
                /* Rails were sized for 320-360px sidebars; drop that floor
                   when they're full-width so contents don't overflow. */
                min-width: 0;
            }
            section.dash-center { order: 1; }
            aside.dash-left-rail  { order: 2; }
            aside.dash-right-rail { order: 3; }
        }

        /* ====================================================================
         * #50 — Mobile pass for the dashboard SHELL.
         *
         * The 1200px breakpoint above already collapses the 3-col grid to one
         * column and hides the rails. At true tablet / phone widths the header,
         * watchlist, news ticker, chain-of-thought, footer, and #liveReport
         * band still need their own compression. Chart-panel internals are
         * handled by chart-panel.css (which already ships ≤1200/≤768 rules).
         * ==================================================================== */

        @media (max-width: 768px) {
            header#dashHeader {
                height: auto;
                min-height: 56px;
                padding: 6px 10px;
                gap: 8px;
                flex-wrap: wrap;
            }
            #watchlistStrip { height: 96px; padding: 8px; }
            #newsTicker     { height: 56px; padding: 6px 8px; }
            main.dash-main-grid { padding: 8px; gap: 8px; }
            #strategyLeaderboard { min-height: 120px; max-height: 200px; }
            #chainOfThought { min-height: 160px; padding: 8px; }
            .dash-bottom-row {
                grid-template-columns: 1fr;
                min-height: 0;
                padding: 8px;
                gap: 8px;
            }
            #liveReport,
            #equityCurve {
                min-height: 240px;
            }
            footer.dash-footer {
                min-height: 48px;
                padding: 6px 8px;
            }
        }

        @media (max-width: 480px) {
            header#dashHeader { padding: 4px 8px; gap: 6px; }
            #watchlistStrip { height: 84px; padding: 6px; }
            #newsTicker     { height: 48px; padding: 4px 6px; font-size: 10px; }
            #chainOfThought { min-height: 140px; padding: 6px; }
            .dash-bottom-row { padding: 6px; gap: 6px; }
            #liveReport,
            #equityCurve {
                min-height: 200px;
                padding: 6px;
                font-size: 10px;
            }
            footer.dash-footer { min-height: 40px; padding: 4px 6px; }
            #systemHealth { padding: 6px; font-size: 10px; }
            /* Body-level guard: prevent any rogue child from forcing
               horizontal scroll on a phone-width viewport. */
            body { overflow-x: hidden; }
        }

        /* ========================================================================
           OGZPrime Design System v3 - Visual Enhancement Layer
           Additive overrides. Production panel CSS and JS remain on current paths.
           ======================================================================== */

        header#dashHeader {
            min-height: 68px;
            height: auto;
        }

        #chainOfThought,
        #confidenceHeatbar,
        #chartPanel,
        #liveReadouts,
        #patternCard,
        #openPositions,
        #edgeAnalyticsPanel,
        #traiBrain,
        #sizePreview,
        #riskGauge,
        #tradeLog,
        #strategyLeaderboard,
        #equityCurve,
        #liveReport {
            transition: box-shadow 0.3s ease, transform 0.3s ease;
            border-radius: 8px;
        }

        #chainOfThought:hover,
        #openPositions:hover,
        #traiBrain:hover,
        #strategyLeaderboard:hover {
            box-shadow: 0 8px 28px rgba(0,0,0,0.6),
                        0 0 0 1px rgba(220,38,38,0.20),
                        0 0 18px rgba(220,38,38,0.14);
            transform: translateY(-1px);
        }

        #watchlistStrip {
            background: var(--bg-secondary) !important;
            border-bottom: 1px solid rgba(255,255,255,0.10) !important;
        }

        @keyframes ogz-gold-flash {
            0%, 100% {
                text-shadow: 0 0 6px rgba(255,215,0,0.45);
                filter: brightness(1);
            }
            50% {
                text-shadow: 0 0 16px rgba(255,215,0,0.95), 0 0 28px rgba(255,215,0,0.5);
                filter: brightness(1.25);
            }
        }
        @keyframes ogz-gold-ring {
            0%   { box-shadow: 0 0 0 0 rgba(255,215,0,0.55); }
            70%  { box-shadow: 0 0 0 10px rgba(255,215,0,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,215,0,0); }
        }
        @keyframes ogz-status-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.6; transform: scale(1.1); }
        }

        .ogz-gold-flash {
            animation: ogz-gold-flash 1.6s ease-in-out infinite;
            color: #ffd700 !important;
        }

        .dash-bottom-row {
            background: rgba(0,0,0,0.55) !important;
            border-top: 1px solid rgba(255,255,255,0.10) !important;
        }

        footer.dash-footer {
            background: rgba(0,0,0,0.85) !important;
            border-top: 1px solid rgba(255,255,255,0.10) !important;
        }

        main.dash-main-grid {
            background: transparent;
        }
    </style>
</head>

<body>

    <!-- ========================================================================
         HEADER STRIP

         Status: Empty for now (awaits HeaderStrip module extraction)
         Current state: Header layout exists in unified-dashboard.html inline.
                        No dedicated HeaderStrip module yet.
         Next: Extract header content to public/js/panels/header-strip.js +
                public/css/panels/header-strip.css, then mount here.
         ======================================================================== -->
    <header id="dashHeader" class="dash-header">
        <!-- HeaderStrip module populates this (public/js/panels/header-strip.js) -->
    </header>

    <!-- ========================================================================
         WATCHLIST STRIP

         Status: Module exists as public/js/panels/watchlist-strip.js
         Features: Multi-ticker cards with live prices, sparklines, position state
         Mount point: WatchlistStrip.js targets #watchlistStrip at init
         ======================================================================== -->
    <div id="watchlistStrip"></div>

    <!-- ========================================================================
         NEWS TICKER

         Status: Module exists as public/js/panels/news-ticker.js
         Features: RTL marquee scrolling of trading-altering events (FOMC, earnings, etc.)
         Mount point: NewsTicker.js targets #newsTicker at init
         ======================================================================== -->
    <div id="newsTicker"></div>

    <!-- ========================================================================
         MAIN GRID: Left Rail | Center | Right Rail
         ======================================================================== -->
    <main class="dash-main-grid">

        <!-- ====================================================================
             LEFT RAIL: Chain of Thought + Confidence Heatbar
             ==================================================================== -->
        <aside class="dash-left-rail">

            <!-- Chain of Thought -->
            <!-- Status: SHIPPED — public/js/panels/chain-of-thought.js
                 Streaming reasoning ribbon. Newest line at bottom. Bot's live decision narration.
                 Subscribes to narrator_event (verified) + bot_thinking + signal_analysis. -->
            <div id="chainOfThought"></div>

            <!-- Confidence Heatbar (Phase E) -->
            <!-- Status: Module exists as public/js/panels/confidence-heatbar.js
                 Mount-point ID matches the module's ROOT_ID = 'confidenceHeatbar'. -->
            <div id="confidenceHeatbar"></div>
        </aside>

        <!-- ====================================================================
             CENTER COLUMN: Chart, Readouts + Pattern Card
             ==================================================================== -->
        <section class="dash-center">

            <!-- Chart Panel — Phase 5 refactor.
                 Self-rendering module: public/js/panels/chart-panel.js
                 Builds full chart scaffold (header + controls + tvChartContainer +
                 HUD + crosshair tooltip + 11 indicator checkboxes) at mount time.
                 All legacy IDs preserved inside (tvChartContainer, currentPrice,
                 chartHudOhlc, etc.) so drawing-tools.js + other consumers still work. -->
            <div id="chartPanel"></div>

            <!-- Strategy Leaderboard moved to right rail under Trade Log. -->

            <!-- Readouts Row: Live Readouts + Pattern Card (side-by-side) -->
            <div class="dash-readouts-row">

                <!-- Live Readouts Panel -->
                <!-- Status: NOT YET EXTRACTED FROM MONOLITH
                     Current state: Inline in unified-dashboard.html
                     TODO: Extract inline readout HTML/CSS to modular live-readouts.js
                     For now: Leave empty. -->
                <!-- Status: SHIPPED — public/js/panels/live-readouts.js
                     2x3 grid: RSI / MACD / ATR / Volume / LiveConf / Pattern.
                     Cell flash on value updates. Color-coded by metric. -->
                <div id="liveReadouts"></div>

                <!-- Pattern Card Panel (NEW) -->
                <!-- Status: Module exists as public/js/panels/pattern-card.js -->
                <!-- Features: SVG pattern illustrations, ML detection state, recent history -->
                <div id="patternCard">
                    <div class="v2-placeholder">[ Pattern Card ]</div>
                </div>
            </div>
        </section>

        <!-- ====================================================================
             RIGHT RAIL: Positions, Edge Analytics, TRAI Brain, Size Preview, Risk Gauge, Trade Log
             ==================================================================== -->
        <aside class="dash-right-rail">

            <!-- Open Positions Panel -->
            <!-- Status: SHIPPED — public/js/panels/open-positions.js
                 Shows all concurrently-held positions across 9 tickers.
                 One row per position. Aggregate P&L at top. Live price updates.
                 Highlights selected ticker's position with gold border. -->
            <div id="openPositions"></div>

            <!-- Edge Analytics Panel — Phase 5 refactor.
                 Self-rendering module: public/js/panels/edge-analytics-panel.js
                 Builds the 8-section scaffold (Liquidation, CVD, Funding, Whales,
                 Internals, Smart Money, Fear & Greed, Divergences) at mount time.
                 All legacy child IDs (cvdValue, fgFill, etc.) preserved inside. -->
            <div id="edgeAnalyticsPanel"></div>

            <!-- TRAI Brain Panel -->
            <!-- Status: SHIPPED — public/js/panels/trai-brain.js
                 Replaces the popup chat behavior of trai-widget.js on this dashboard.
                 trai-widget.js stays loaded for backward compat / non-dashboard pages. -->
            <div id="traiBrain"></div>

            <!-- Size Preview Panel -->
            <!-- Status: Module exists as public/js/panels/size-preview.js -->
            <!-- Features: Position sizing calculator, risk/reward preview -->
            <div id="sizePreview">
                <div class="v2-placeholder">[ Size Preview ]</div>
            </div>

    <!-- Boot Script -->
    <script>
        (function() {
            'use strict';

            // Boot: Connect WebSocket + Initialize all registered panels
            // OGZ.init() (defined in core.js) calls init() on Chart, Socket,
            // Operator, Edge, DrawingTools, CommandPalette, Heatbar, RiskGauge,
            // CandleCountdown, SessionPhase, SizePreview, StrategyLeaderboard.
            //
            // OGZ.Theme is NOT in OGZ.init()'s sequence — must be init'd explicitly.
            // Without this call: theme persistence breaks, theme buttons don't bind,
            // saved theme from localStorage doesn't restore. (CC fix preserved.)

            if (window.OGZ && typeof window.OGZ.init === 'function') {
                window.OGZ.init();

                if (window.OGZ.get && window.OGZ.get('Theme')) {
                    try { window.OGZ.get('Theme').init(); }
                    catch (e) { console.warn('[Dashboard v2] Theme.init() failed:', e); }
                }

                // NOTE: Registered modules are NOT init'd here. core.js
                // OGZ.init() already auto-inits every registered module
                // except the SPECIAL set Chart/Socket/Theme; Theme remains
                // manual above. Calling init() again here double-initializes
                // panels and duplicates their event subscriptions.
                // Registration via OGZ.register() is all the wiring they need.
            } else {
                console.error('[Dashboard v2] OGZ namespace failed to load. Check core.js.');
            }
        })();
    </script>
