<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ========================================================================
         OGZPrime Unified Dashboard v2 — Modular-by-Design Shell
         ========================================================================
         Created: 2026-05-06
         Purpose: Production-grade replacement for the monolithic unified-dashboard.html.
                  This file is a THIN SHELL only — no inline panel logic or CSS.
                  All panel behavior lives in public/js/panels/*.js
                  All panel styling lives in public/css/panels/*.css and public/css/*.css

         Deployment: Runs ALONGSIDE the v1 monolith. No overwrite.
                     Both dashboards can be accessed in production.

         Philosophy: A tiny HTML file (~500 lines total) that:
                     1. Imports theme variables + font CDNs (head)
                     2. Provides empty mount-point divs for modules (body)
                     3. Loads all module scripts in order (bottom of body)
                     4. Calls OGZ.init() to boot the system (inline script)

         Future work: As modules are extracted from the monolith, they will be
                      added to this shell. Regions without modules yet are
                      marked with TODO comments + placeholder divs.
         ======================================================================== -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- WS auth token. Server-injected at request time.
         Empty placeholder here is intentional — static file MUST NOT carry the token.
         See public/js/websocket.js for token resolution priority. -->
    <meta name="ws-token" content="">

    <title>OGZPrime Unified Dashboard v2</title>

    <!-- TradingView Lightweight Charts v4.1 -->
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>

    <!-- Per-panel CSS imports (existing panels) -->
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/trading-panel.css">
    <link rel="stylesheet" href="/css/asset-tf-card.css">
    <link rel="stylesheet" href="/css/header-brand.css">
    <link rel="stylesheet" href="/css/golden-proximity.css">
    <link rel="stylesheet" href="/css/pattern-sparkline.css">

    <!-- Per-panel CSS imports (NEW modules) -->
    <link rel="stylesheet" href="/css/panels/news-ticker.css">
    <link rel="stylesheet" href="/css/panels/watchlist-strip.css">
    <link rel="stylesheet" href="/css/panels/pattern-card.css">
    <link rel="stylesheet" href="/css/panels/header-strip.css">
    <link rel="stylesheet" href="/css/panels/trai-brain.css">
    <link rel="stylesheet" href="/css/panels/open-positions.css">
    <link rel="stylesheet" href="/css/panels/chain-of-thought.css">
    <link rel="stylesheet" href="/css/panels/equity-curve.css">
    <link rel="stylesheet" href="/css/panels/system-health.css">
    <link rel="stylesheet" href="/css/panels/live-readouts.css">
    <link rel="stylesheet" href="/css/panels/cyberpunk-polish.css">

    <!-- Phase 5 refactor — self-rendering chart + edge-analytics modules.
         Replace legacy chart.js + edge-analytics.js DOM-binders. -->
    <link rel="stylesheet" href="/css/panels/chart-panel.css">
    <link rel="stylesheet" href="/css/panels/edge-analytics-panel.css">

    <style>
        /* ========================================================================
           THEME VARIABLES & FOUNDATIONAL STYLES
           Copied from unified-dashboard.html (L30-49 + Phase B root block L2384-2399)
           Every panel CSS file references these variables.
           ======================================================================== */

        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=Orbitron:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Core theme palette */
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --bg-panel: rgba(20, 20, 20, 0.9);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;

            /* Version-specific colors */
            --core-color: #00ccff;
            --ml-color: #ffd700;

            --profit-color: #00ff88;
            --loss-color: #ff3366;
            --neutral-color: #8b8b8b;

            --metallic-gradient: linear-gradient(135deg, #c0c0c0 0%, #808080 50%, #c0c0c0 100%);
            --core-gradient: linear-gradient(135deg, #00ccff 0%, #4dddff 50%, #00ccff 100%);
            --ml-gradient: linear-gradient(135deg, #ffd700 0%, #ffed4e 50%, #ffd700 100%);

            /* OGZprime brand palette (Phase B) */
            --brand-red:          #dc2626;
            --brand-red-bright:   #ef4444;
            --brand-red-dim:      #991b1b;
            --brand-red-glow:     rgba(220, 38, 38, 0.55);
            --brand-red-line:     rgba(220, 38, 38, 0.25);

            /* Glass surfaces */
            --glass-bg:           rgba(14, 14, 16, 0.72);
            --glass-bg-strong:    rgba(10, 10, 12, 0.86);
            --glass-border:       rgba(220, 38, 38, 0.14);
            --glass-border-hover: rgba(220, 38, 38, 0.38);
            --glass-shadow:       0 8px 28px rgba(0, 0, 0, 0.55),
                                  0 0 0 1px rgba(220, 38, 38, 0.06) inset;

            /* Resizable rails (driven by rail-resize.js) */
            --left-rail-width: 320px;
            --right-rail-width: 320px;
            --rail-gap: 20px;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            overflow-y: auto;
            min-height: 100vh;
            cursor: auto;
            position: relative;
        }

        html {
            cursor: auto;
        }

        /* Drag handles for resizable rails — driven by rail-resize.js */
        .rail-resize-handle {
            position: fixed;
            top: 100px;
            bottom: 20px;
            width: 6px;
            cursor: col-resize;
            z-index: 99;
            background: transparent;
            transition: background 120ms ease;
        }

        .rail-resize-handle:hover,
        .rail-resize-handle.dragging {
            background: rgba(220, 38, 38, 0.45);
            box-shadow: 0 0 12px rgba(220, 38, 38, 0.35);
        }

        #leftRailResize  { left: calc(var(--left-rail-width) + 12px); }
        #rightRailResize { right: calc(var(--right-rail-width) + 12px); }

        body.rail-dragging,
        body.rail-dragging * {
            user-select: none !important;
            cursor: col-resize !important;
        }

        /* Background gradient effects (from monolith L106-118) */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(255, 215, 0, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(0, 255, 255, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* ========================================================================
           PAGE-LEVEL GRID LAYOUT
           Structural CSS for the main dashboard regions.
           Mount-point divs below map to these regions.
           ======================================================================== */

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* Header strip — will contain brand, status lights, hero price, etc. */
        header#dashHeader {
            height: 60px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 16px;
            flex-shrink: 0;
            z-index: 10;
        }

        /* Watchlist strip — horizontal scrolling multi-ticker panel */
        #watchlistStrip {
            height: 120px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
            padding: 12px;
            overflow-x: auto;
            overflow-y: hidden;
            flex-shrink: 0;
            z-index: 5;
        }

        /* News ticker — horizontal scrolling RTL news events */
        #newsTicker {
            height: 80px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
            padding: 8px 12px;
            overflow-x: auto;
            overflow-y: hidden;
            flex-shrink: 0;
            z-index: 5;
        }

        /* Main content grid: left rail | center | right rail */
        main.dash-main-grid {
            display: grid;
            grid-template-columns: var(--left-rail-width) 1fr var(--right-rail-width);
            gap: var(--rail-gap);
            flex: 1;
            overflow: hidden;
            padding: var(--rail-gap);
            min-height: 0;
        }

        /* Left rail — edge analytics, confidence heatbar, etc. */
        aside.dash-left-rail {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            min-height: 0;
            padding: 0;
        }

        /* Center column — chart, strategy leaderboard, pattern card, readouts, etc. */
        section.dash-center {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            min-height: 0;
            padding: 0;
        }

        /* Chart container — sized dynamically by chart.js */
        #chartContainer {
            flex: 2;
            min-height: 300px;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            overflow: hidden;
        }

        /* Strategy leaderboard */
        #strategyLeaderboard {
            flex: 1;
            min-height: 150px;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            overflow-y: auto;
        }

        /* Readouts row: side-by-side live readouts + pattern card */
        .dash-readouts-row {
            display: flex;
            gap: 12px;
            min-height: 120px;
            flex-shrink: 0;
        }

        #liveReadouts {
            flex: 1;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            overflow-y: auto;
        }

        #patternCard {
            flex: 0 0 280px;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            overflow-y: auto;
        }

        /* Right rail — open positions, TRAI brain, size preview, risk gauge, trade log */
        aside.dash-right-rail {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            min-height: 0;
            padding: 0;
        }

        /* Right rail mount points */
        #openPositions,
        #traiBrain,
        #sizePreview,
        #riskGauge,
        #tradeLog {
            min-height: 80px;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            overflow-y: auto;
            flex: 0 1 auto;
        }

        #tradeLog {
            flex: 1;
            min-height: 150px;
        }

        /* Chain of thought — ribbon below main grid */
        #chainOfThought {
            height: 140px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-secondary);
            padding: 12px;
            overflow-y: auto;
            flex-shrink: 0;
            z-index: 5;
        }

        /* Footer: equity curve + system health */
        footer.dash-footer {
            height: 100px;
            border-top: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 12px;
            flex-shrink: 0;
            z-index: 10;
        }

        #equityCurve,
        #systemHealth {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            overflow-y: auto;
        }

        /* ========================================================================
           PLACEHOLDER STYLING
           Used for mount-points that don't yet have modules.
           Option B: Show a visual placeholder so gaps are obvious.
           ======================================================================== */

        .v2-banner {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(220, 38, 38, 0.15);
            color: var(--brand-red-bright);
            padding: 4px 12px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            z-index: 1000;
            border-radius: 0 0 6px 6px;
            border: 1px solid var(--brand-red-line);
            border-top: none;
        }

        .v2-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: rgba(160, 160, 160, 0.6);
            font-size: 10px;
            font-weight: 300;
            text-align: center;
            padding: 8px;
        }

        /* Responsive grid for mobile */
        @media (max-width: 1200px) {
            main.dash-main-grid {
                grid-template-columns: 1fr;
            }
            aside.dash-left-rail,
            aside.dash-right-rail {
                display: none;
            }
        }
    </style>
</head>

<body>
    <!-- Optional: V2 staging banner -->
    <div class="v2-banner">DASHBOARD v2 — MODULAR SHELL</div>

    <!-- ========================================================================
         HEADER STRIP

         Status: Empty for now (awaits HeaderStrip module extraction)
         Current state: Header layout exists in unified-dashboard.html inline.
                        No dedicated HeaderStrip module yet.
         Next: Extract header content to public/js/panels/header-strip.js +
                public/css/panels/header-strip.css, then mount here.
         ======================================================================== -->
    <header id="dashHeader" class="dash-header">
        <!-- HeaderStrip module populates this (public/js/panels/header-strip.js) -->
    </header>

    <!-- ========================================================================
         WATCHLIST STRIP

         Status: Module exists as public/js/panels/watchlist-strip.js
         Features: Multi-ticker cards with live prices, sparklines, position state
         Mount point: WatchlistStrip.js targets #watchlistStrip at init
         ======================================================================== -->
    <div id="watchlistStrip"></div>

    <!-- ========================================================================
         NEWS TICKER

         Status: Module exists as public/js/panels/news-ticker.js
         Features: RTL marquee scrolling of trading-altering events (FOMC, earnings, etc.)
         Mount point: NewsTicker.js targets #newsTicker at init
         ======================================================================== -->
    <div id="newsTicker"></div>

    <!-- ========================================================================
         MAIN GRID: Left Rail | Center | Right Rail
         ======================================================================== -->
    <main class="dash-main-grid">

        <!-- ====================================================================
             LEFT RAIL: Edge Analytics + Confidence Heatbar
             ==================================================================== -->
        <aside class="dash-left-rail">

            <!-- Edge Analytics Panel — Phase 5 refactor.
                 Self-rendering module: public/js/panels/edge-analytics-panel.js
                 Builds the 8-section scaffold (Liquidation, CVD, Funding, Whales,
                 Internals, Smart Money, Fear & Greed, Divergences) at mount time.
                 All legacy child IDs (cvdValue, fgFill, etc.) preserved inside. -->
            <div id="edgeAnalyticsPanel"></div>

            <!-- Confidence Heatbar (Phase E) -->
            <!-- Status: Module exists as public/js/panels/confidence-heatbar.js
                 Mount-point ID matches the module's ROOT_ID = 'confidenceHeatbar'. -->
            <div id="confidenceHeatbar"></div>
        </aside>

        <!-- ====================================================================
             CENTER COLUMN: Chart, Strategy Leaderboard, Readouts + Pattern Card
             ==================================================================== -->
        <section class="dash-center">

            <!-- Chart Panel — Phase 5 refactor.
                 Self-rendering module: public/js/panels/chart-panel.js
                 Builds full chart scaffold (header + controls + tvChartContainer +
                 HUD + crosshair tooltip + 11 indicator checkboxes) at mount time.
                 All legacy IDs preserved inside (tvChartContainer, currentPrice,
                 chartHudOhlc, etc.) so drawing-tools.js + other consumers still work. -->
            <div id="chartPanel"></div>

            <!-- Strategy Leaderboard -->
            <!-- Status: Module exists as public/js/panels/strategy-leaderboard.js -->
            <!-- Features: Backtest leaderboard, historical trade performance -->
            <div id="strategyLeaderboard">
                <div class="v2-placeholder">[ Strategy Leaderboard ]</div>
            </div>

            <!-- Readouts Row: Live Readouts + Pattern Card (side-by-side) -->
            <div class="dash-readouts-row">

                <!-- Live Readouts Panel -->
                <!-- Status: NOT YET EXTRACTED FROM MONOLITH
                     Current state: Inline in unified-dashboard.html
                     TODO: Extract inline readout HTML/CSS to modular live-readouts.js
                     For now: Leave empty. -->
                <!-- Status: SHIPPED — public/js/panels/live-readouts.js
                     2x3 grid: RSI / MACD / ATR / Volume / LiveConf / Pattern.
                     Cell flash on value updates. Color-coded by metric. -->
                <div id="liveReadouts"></div>

                <!-- Pattern Card Panel (NEW) -->
                <!-- Status: Module exists as public/js/panels/pattern-card.js -->
                <!-- Features: SVG pattern illustrations, ML detection state, recent history -->
                <div id="patternCard">
                    <div class="v2-placeholder">[ Pattern Card ]</div>
                </div>
            </div>
        </section>

        <!-- ====================================================================
             RIGHT RAIL: Positions, TRAI Brain, Size Preview, Risk Gauge, Trade Log
             ==================================================================== -->
        <aside class="dash-right-rail">

            <!-- Open Positions Panel -->
            <!-- Status: SHIPPED — public/js/panels/open-positions.js
                 Shows all concurrently-held positions across 9 tickers.
                 One row per position. Aggregate P&L at top. Live price updates.
                 Highlights selected ticker's position with gold border. -->
            <div id="openPositions"></div>

            <!-- TRAI Brain Panel -->
            <!-- Status: SHIPPED — public/js/panels/trai-brain.js
                 Replaces the popup chat behavior of trai-widget.js on this dashboard.
                 trai-widget.js stays loaded for backward compat / non-dashboard pages. -->
            <div id="traiBrain"></div>

            <!-- Size Preview Panel -->
            <!-- Status: Module exists as public/js/panels/size-preview.js -->
            <!-- Features: Position sizing calculator, risk/reward preview -->
            <div id="sizePreview">
                <div class="v2-placeholder">[ Size Preview ]</div>
            </div>

            <!-- Risk Gauge Panel (Phase E) -->
            <!-- Status: Module exists as public/js/panels/risk-gauge.js -->
            <!-- Features: Live portfolio risk percentage, position risk breakdown -->
            <div id="riskGauge">
                <div class="v2-placeholder">[ Risk Gauge ]</div>
            </div>

            <!-- Trade Log Panel -->
            <!-- Status: Module exists as public/js/panels/trade-log.js -->
            <!-- Features: Session trade entry/exit history, P&L tracking, session performance -->
            <div id="tradeLog">
                <div class="v2-placeholder">[ Trade Log ]</div>
            </div>
        </aside>
    </main>

    <!-- ========================================================================
         CHAIN OF THOUGHT RIBBON

         Status: NOT YET EXTRACTED FROM MONOLITH
         Current state: Inline in unified-dashboard.html (trai-widget.js narrative output)
         TODO: Determine if CoT should be a dedicated panel or remain tightly coupled
               to the root-level TRAI widget system.
         For now: Empty mount point. trai-widget.js may populate this directly.
         ======================================================================== -->
    <!-- Status: SHIPPED — public/js/panels/chain-of-thought.js
         Streaming reasoning ribbon. Newest line at bottom. Bot's live decision narration.
         Subscribes to narrator_event (verified) + bot_thinking + signal_analysis. -->
    <div id="chainOfThought"></div>

    <!-- ========================================================================
         FOOTER: Equity Curve + System Health
         ======================================================================== -->
    <footer class="dash-footer">

        <!-- Equity Curve (Daily/Weekly/Monthly PnL chart) -->
        <!-- Status: NOT YET EXTRACTED FROM MONOLITH
             Current state: Inline in unified-dashboard.html
             TODO: Extract to public/js/panels/equity-curve.js
             For now: Leave empty. -->
        <!-- Status: SHIPPED — public/js/panels/equity-curve.js
             SVG line chart matching /proof/track-record/ visuals. Profit target + DD floor
             dashed lines. Trade markers along curve. Range selector (1D/7D/30D/ALL). -->
        <div id="equityCurve"></div>

        <!-- System Health (Bot status, feed latency, API status) -->
        <!-- Status: NOT YET EXTRACTED FROM MONOLITH
             Current state: Status lights inline in header + system-snapshot.js (limited)
             TODO: Consolidate health indicators into a dedicated system-health.js panel
             For now: Leave empty. system-snapshot.js may populate this. -->
        <!-- Status: SHIPPED — public/js/panels/system-health.js
             Footer health strip: SessionRouter, broker WS, errors, uptime, last crash, risk posture, commit.
             Polls /api/health every 30s + listens to WS state_update / error_event / broker_status. -->
        <div id="systemHealth"></div>
    </footer>

    <!-- ========================================================================
         MODULE IMPORTS

         Order MATTERS. Load as follows:
         1. Core orchestrator (provides OGZ namespace)
         2. Data layer (indicators, websocket)
         3. Chart system
         4. Utilities (drawing tools, theme customizer, command palette)
         5. Execution (trade manager)
         6. Panels (self-registering, order-independent for registration but
                    grouped by subsystem for clarity)
         7. Root-level widgets (trai-widget.js loads last)
         8. Inline boot script (calls OGZ.init())
         ======================================================================== -->

    <!-- Core Orchestrator: provides OGZ namespace + module registry -->
    <script src="/js/core.js"></script>

    <!-- Data Layer -->
    <script src="/js/indicators.js"></script>
    <script src="/js/websocket.js"></script>

    <!-- Chart System — Phase 5: legacy chart.js DELETED from import list.
         Replaced by ChartPanel module loaded below. -->

    <!-- Utilities & Utilities -->
    <script src="/js/drawing-tools.js"></script>
    <script src="/js/theme-customizer.js"></script>
    <script src="/js/command-palette.js"></script>

    <!-- Execution Layer -->
    <script src="/js/operator/trade-manager.js"></script>

    <!-- Panel Modules (self-registering)
         Grouped by subsystem for clarity:

         Structural panels (resizing, layout) -->
    <script src="/js/panels/rail-resize.js"></script>

    <!-- System monitoring panels -->
    <script src="/js/panels/system-snapshot.js"></script>

    <!-- Edge Analytics subsystem — Phase 5: legacy edge-analytics.js DELETED
         from import list. Replaced by EdgeAnalyticsPanel module loaded below. -->

    <!-- Asset/Timeframe cards -->
    <script src="/js/panels/asset-tf-card.js"></script>
    <script src="/js/panels/pattern-sparkline.js"></script>

    <!-- Bot Intelligence subsystem -->
    <script src="/js/panels/bot-intelligence.js"></script>

    <!-- Phase E: Confidence Heatbar + Risk Gauge -->
    <script src="/js/panels/confidence-heatbar.js"></script>
    <script src="/js/panels/risk-gauge.js"></script>

    <!-- Phase F: HUD Widgets (Candle Countdown, Session Phase, Size Preview, Strategy Leaderboard) -->
    <script src="/js/panels/candle-countdown.js"></script>
    <script src="/js/panels/session-phase.js"></script>
    <script src="/js/panels/size-preview.js"></script>
    <script src="/js/panels/strategy-leaderboard.js"></script>

    <!-- Trading panels -->
    <script src="/js/panels/trade-log.js"></script>
    <script src="/js/panels/spoofing-detector.js"></script>

    <!-- NEW Modules (v2 shells) -->
    <script src="/js/panels/watchlist-strip.js"></script>
    <script src="/js/panels/news-ticker.js"></script>
    <script src="/js/panels/pattern-card.js"></script>
    <script src="/js/panels/header-strip.js"></script>
    <script src="/js/panels/trai-brain.js"></script>
    <script src="/js/panels/open-positions.js"></script>
    <script src="/js/panels/chain-of-thought.js"></script>
    <script src="/js/panels/equity-curve.js"></script>
    <script src="/js/panels/system-health.js"></script>
    <script src="/js/panels/live-readouts.js"></script>
    <script src="/js/panels/celebration.js"></script>

    <!-- Phase 5 self-rendering modules (replace legacy chart.js + edge-analytics.js) -->
    <script src="/js/panels/chart-panel.js"></script>
    <script src="/js/panels/edge-analytics-panel.js"></script>

    <!-- Root-level widget (loads last, after all panels registered).
         NOTE: trai-widget.js lives at the public/ root, not in public/js/.
         Path is /trai-widget.js (no /js/ prefix). -->
    <script src="/trai-widget.js"></script>

    <!-- Boot Script -->
    <script>
        (function() {
            'use strict';

            // Boot: Connect WebSocket + Initialize all registered panels
            // OGZ.init() (defined in core.js) calls init() on Chart, Socket,
            // Operator, Edge, DrawingTools, CommandPalette, Heatbar, RiskGauge,
            // CandleCountdown, SessionPhase, SizePreview, StrategyLeaderboard.
            //
            // OGZ.Theme is NOT in OGZ.init()'s sequence — must be init'd explicitly.
            // Without this call: theme persistence breaks, theme buttons don't bind,
            // saved theme from localStorage doesn't restore. (CC fix preserved.)

            if (window.OGZ && typeof window.OGZ.init === 'function') {
                window.OGZ.init();

                // Phase 5: ChartPanel + EdgeAnalyticsPanel are NOT in OGZ.init()'s
                // hardcoded sequence (core.js still references the legacy 'Chart'
                // and 'Edge' module names). Explicit init required for both.
                if (window.OGZ.get && window.OGZ.get('ChartPanel')) {
                    try { window.OGZ.get('ChartPanel').init(); }
                    catch (e) { console.warn('[Dashboard v2] ChartPanel.init() failed:', e); }
                }
                if (window.OGZ.get && window.OGZ.get('EdgeAnalyticsPanel')) {
                    try { window.OGZ.get('EdgeAnalyticsPanel').init(); }
                    catch (e) { console.warn('[Dashboard v2] EdgeAnalyticsPanel.init() failed:', e); }
                }

                if (window.OGZ.get && window.OGZ.get('Theme')) {
                    try { window.OGZ.get('Theme').init(); }
                    catch (e) { console.warn('[Dashboard v2] Theme.init() failed:', e); }
                }
            } else {
                console.error('[Dashboard v2] OGZ namespace failed to load. Check core.js.');
            }
        })();
    </script>
</body>
</html>
