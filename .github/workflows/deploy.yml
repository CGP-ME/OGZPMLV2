name: OGZPrime Deploy

on:
  push:
    branches:
      - master   # auto-deploy master after merge (human-controlled)
  workflow_dispatch:  # manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OGZ_VPS_KEY }}

      - name: Deploy to VPS
        run: |
          # Replace with your actual VPS details
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'data' \
            --exclude 'logs' \
            . user@${{ secrets.VPS_IP }}:/opt/ogzprime/OGZPMLV2

      - name: Install deps and restart bot
        run: |
          ssh user@${{ secrets.VPS_IP }} << 'EOF'
            cd /opt/ogzprime/OGZPMLV2
            npm ci || npm install

            # The unified launcher preserves private credentials and runtime data,
            # and starts the four declared PM2 processes on the paper profile.
            bash start-ogzprime.sh start

            echo "Empire V2 deployed and restarted"
          EOF

      - name: Verify deployment
        run: |
          sleep 10
          ssh user@${{ secrets.VPS_IP }} "pm2 status ogz-prime-v2 ogz-websocket ogz-stripe ogz-supervisor"
