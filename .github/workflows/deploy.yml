name: OGZPrime Deploy

on:
  push:
    branches:
      - master   # auto-deploy master after merge (human-controlled)
  workflow_dispatch:  # manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OGZ_VPS_KEY }}

      - name: Deploy to VPS
        run: |
          # Replace with your actual VPS details
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude 'logs' \
            --exclude 'pattern_memory*.json' \
            . user@${{ secrets.VPS_IP }}:/opt/ogzprime/OGZPMLV2

      - name: Install deps and restart bot
        run: |
          ssh user@${{ secrets.VPS_IP }} << 'EOF'
            cd /opt/ogzprime/OGZPMLV2
            npm ci || npm install

            # Save pattern memory before restart
            cp pattern_memory.json pattern_memory.backup.$(date +%s).json 2>/dev/null || true

            # Restart with the checked-in PM2 runtime profile so operator-owned
            # live credentials and dashboard auth are preserved through restart.
            pm2 startOrReload ecosystem.config.js --only ogz-websocket --update-env
            pm2 startOrReload ecosystem.config.js --only ogz-prime-v2 --update-env
            pm2 save

            echo "Empire V2 deployed and restarted"
          EOF

      - name: Verify deployment
        run: |
          sleep 10
          ssh user@${{ secrets.VPS_IP }} "pm2 status ogz-websocket ogz-prime-v2"
