class MoverFrontend {
  constructor(containerId = 'mover-container') {
    this.container = document.getElementById(containerId);
    this.config = {
      wsUrl: 'ws://localhost:4001',
      apiUrl: 'http://localhost:4000',
      updateInterval: 1000,
      maxMessages: 100,
      theme: 'mover-dark'
    };
    
    this.state = {
      connected: false,
      moverActive: true,
      voiceEnabled: false,
      currentNarration: '',
      messageHistory: [],
      whaleActivity: [],
      poolStatus: {},
      stats: {
        tradesNarrated: 0,
        profitLoss: 0,
        whalesTracked: 0,
        poolsActive: 0
      }
    };
    
    this.ws = null;
    this.speechSynth = window.speechSynthesis;
    this.selectedVoice = null;
    
    this.initialize();
  }
  
  async initialize() {
    console.log('[MoverUI] Initializing The Mover frontend...');
    
    // Create UI structure
    this.createUI();
    
    // Setup WebSocket connection
    await this.connectWebSocket();
    
    // Load initial data
    await this.loadInitialData();
    
    // Setup voice if available
    this.setupVoice();
    
    // Start update loops
    this.startUpdateLoops();
    
    // Setup event listeners
    this.setupEventListeners();
    
    console.log('[MoverUI] Initialization complete');
  }

  async connectWebSocket() {
    return new Promise((resolve, reject) => {
      this.ws = new WebSocket(this.config.wsUrl);
      
      this.ws.onopen = () => {
        console.log('[MoverUI] WebSocket connected');
        this.updateConnectionStatus(true);
        this.state.connected = true;
        resolve();
      };
      
      this.ws.onmessage = (event) => {
        this.handleWebSocketMessage(event);
      };
      
      this.ws.onerror = (error) => {
        console.error('[MoverUI] WebSocket error:', error);
        this.updateConnectionStatus(false, 'error');
        reject(error);
      };
      
      this.ws.onclose = () => {
        console.log('[MoverUI] WebSocket disconnected');
        this.updateConnectionStatus(false);
        this.state.connected = false;
        
        // Reconnect after 3 seconds
        setTimeout(() => this.connectWebSocket(), 3000);
      };
    });
  }
  
  handleWebSocketMessage(event) {
    try {
      const message = JSON.parse(event.data);
      
      switch (message.type) {
        case 'narration':
          this.addNarration(message.data);
          break;
          
        case 'whale-trade':
          this.handleWhaleTrade(message.data);
          break;
          
        case 'pool-update':
          this.updatePoolStatus(message.data);
          break;
          
        case 'whale-alert':
          this.showWhaleAlert(message.data);
          break;
          
        case 'memory-update':
          this.updateMemoryStats(message.data);
          break;
          
        case 'bot-event':
          this.handleBotEvent(message.data);
          break;
          
        default:
          console.log('[MoverUI] Unknown message type:', message.type);
      }
    } catch (error) {
      console.error('[MoverUI] Message handling error:', error);
    }
  }
  
  addNarration(narration) {
    const feed = document.getElementById('narration-feed');
    
    // Remove welcome message if present
    const welcome = feed.querySelector('.welcome-message');
    if (welcome) welcome.remove();
    
    // Create narration item
    const item = document.createElement('div');
    item.className = 'narration-item';
    
    const timestamp = new Date().toLocaleTimeString();
    const profitClass = narration.includes('+$') ? 'profit' : 
                       narration.includes('-$') ? 'loss' : '';
    
    item.innerHTML = `
      <div class="narration-timestamp">${timestamp}</div>
      <div class="narration-text ${profitClass}">${narration}</div>
    `;
    
    feed.appendChild(item);
    
    // Update current narration
    document.getElementById('narration-text').textContent = narration;
    
    // Speak if voice enabled
    if (this.state.voiceEnabled) {
      this.speak(narration);
    }
    
    // Limit history
    while (feed.children.length > this.config.maxMessages) {
      feed.removeChild(feed.firstChild);
    }
    
    // Auto-scroll
    feed.scrollTop = feed.scrollHeight;
    
    // Update stats
    this.state.stats.tradesNarrated++;
    this.updateStats();
  }
  
  handleWhaleTrade(trade) {
    // Add to whale activity
    this.state.whaleActivity.unshift(trade);
    if (this.state.whaleActivity.length > 20) {
      this.state.whaleActivity.pop();
    }
    
    // Show alert
    this.showWhaleAlert({
      type: 'trade',
      whale: trade.whale,
      action: trade.action,
      symbol: trade.symbol,
      confidence: trade.confidence,
      urgency: trade.urgency
    });
    
    // Update convergence if present
    if (trade.convergenceScore) {
      this.updateConvergence(trade.convergenceScore, trade.convergenceWhales);
    }
  }
  
  showWhaleAlert(alert) {
    const alertsContainer = document.getElementById('whale-alerts');
    
    // Remove placeholder if present
    const placeholder = alertsContainer.querySelector('.alert-placeholder');
    if (placeholder) placeholder.remove();
    
    const alertDiv = document.createElement('div');
    alertDiv.className = `whale-alert ${alert.urgency === 'high' ? 'urgent' : ''}`;
    
    alertDiv.innerHTML = `
      <div class="whale-alert-header">
        <span class="whale-icon">🐋</span>
        <span class="whale-name">${alert.whale}</span>
        <span class="alert-time">${new Date().toLocaleTimeString()}</span>
      </div>
      <div class="whale-alert-body">
        <strong>${alert.action}</strong> ${alert.symbol || ''}
        ${alert.confidence ? `<span class="confidence">(${alert.confidence}% confidence)</span>` : ''}
      </div>
    `;
    
    alertsContainer.insertBefore(alertDiv, alertsContainer.firstChild);
    
    // Limit alerts
    while (alertsContainer.children.length > 10) {
      alertsContainer.removeChild(alertsContainer.lastChild);
    }
  }
  
  updatePoolStatus(data) {
    // Update pool card
    const poolCard = document.querySelector(`[data-pool="${data.pool}"]`);
    if (poolCard) {
      const stats = data.stats || {};
      poolCard.querySelector('.pool-balance').textContent = `$${stats.balance?.toFixed(2) || '0.00'}`;
      poolCard.querySelector('.pool-performance').textContent = 
        `${stats.performance >= 0 ? '+' : ''}${stats.performance?.toFixed(2) || '0.00'}%`;
      poolCard.querySelector('.pool-performance').className = 
        `pool-performance ${stats.performance >= 0 ? 'positive' : 'negative'}`;
      poolCard.querySelector('.pool-positions').textContent = 
        `${stats.activePositions || 0} positions`;
    }
    
    // Update total
    this.updatePoolTotals();
  }
  
  updateConvergence(score, whales) {
    const meterFill = document.querySelector('.meter-fill');
    const convergenceText = document.querySelector('.convergence-text');
    
    meterFill.style.width = `${score}%`;
    convergenceText.textContent = whales.length > 1 ? 
      `${whales.length} whales converging!` : 'No convergence detected';
  }
  
  setupVoice() {
    if (!this.speechSynth) return;
    
    // Get available voices
    const voices = this.speechSynth.getVoices();
    this.selectedVoice = voices.find(v => v.name.includes('Daniel')) || voices[0];
  }
  
  speak(text) {
    if (!this.speechSynth || !this.state.voiceEnabled) return;
    
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.voice = this.selectedVoice;
    utterance.rate = 1.1;
    utterance.pitch = 0.9;
    utterance.volume = 0.8;
    
    this.speechSynth.speak(utterance);
  }
  
  async loadInitialData() {
    try {
      // Load mover status
      const statusResponse = await fetch(`${this.config.apiUrl}/status`);
      const status = await statusResponse.json();
      
      // Load whale status
      const whaleResponse = await fetch(`${this.config.apiUrl}/whales/status`);
      const whaleData = await whaleResponse.json();
      
      // Load pool status
      const poolResponse = await fetch(`${this.config.apiUrl}/pools/status`);
      const poolData = await poolResponse.json();
      
      // Update UI with initial data
      this.state.stats = status.stats || this.state.stats;
      this.state.whaleActivity = whaleData.recentTrades || [];
      this.state.poolStatus = poolData || {};
      
      this.updateStats();
      this.updatePoolTotals();
      
    } catch (error) {
      console.error('[MoverUI] Failed to load initial data:', error);
    }
  }
  
  startUpdateLoops() {
    // Update stats every second
    setInterval(() => {
      if (this.state.connected) {
        this.updateRealTimeStats();
      }
    }, this.config.updateInterval);
    
    // Update whale data every 5 seconds
    setInterval(() => {
      if (this.state.connected) {
        this.fetchWhaleUpdates();
      }
    }, this.config.whaleUpdateInterval);
  }
  
  setupEventListeners() {
    // Mover toggle
    document.getElementById('mover-toggle').addEventListener('click', async () => {
      this.state.moverActive = !this.state.moverActive;
      document.getElementById('mover-toggle').classList.toggle('active');
      
      // TODO: Send toggle command to backend
    });
    
    // Voice toggle
    document.getElementById('voice-toggle').addEventListener('click', async () => {
      this.state.voiceEnabled = !this.state.voiceEnabled;
      document.getElementById('voice-toggle').classList.toggle('active');
      
      const response = await fetch(`${this.config.apiUrl}/voice/toggle`, {
        method: 'POST'
      });
    });
    
    // Whale toggle
    document.getElementById('whale-toggle').addEventListener('click', () => {
      this.state.whaleTracking.enabled = !this.state.whaleTracking.enabled;
      document.getElementById('whale-toggle').classList.toggle('active');
    });
    
    // Clear feed
    document.getElementById('clear-feed').addEventListener('click', () => {
      const feed = document.getElementById('narration-feed');
      feed.innerHTML = '<div class="welcome-message"><p>Feed cleared</p></div>';
    });
    
    // Force whale scan
    document.getElementById('whale-scan').addEventListener('click', async () => {
      const btn = document.getElementById('whale-scan');
      btn.disabled = true;
      btn.textContent = 'Scanning...';
      
      try {
        await fetch(`${this.config.apiUrl}/whales/scan`, { method: 'POST' });
      } catch (error) {
        console.error('Scan failed:', error);
      }
      
      setTimeout(() => {
        btn.disabled = false;
        btn.textContent = 'Force Scan';
      }, 5000);
    });
    
    // Pool toggles
    document.querySelectorAll('.pool-toggle').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const poolId = e.target.dataset.pool;
        const isActive = e.target.classList.contains('active');
        
        await fetch(`${this.config.apiUrl}/pools/toggle/${poolId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ enabled: !isActive })
        });
        
        e.target.classList.toggle('active');
      });
    });
  }
  
  updateConnectionStatus(connected, status = '') {
    const statusEl = document.getElementById('connection-status');
    statusEl.className = `connection-status ${connected ? 'connected' : status}`;
    statusEl.innerHTML = `
      <i class="fas fa-circle"></i> ${connected ? 'Connected' : 'Disconnected'}
    `;
  }
  
  updateStats() {
    document.getElementById('trades-narrated').textContent = this.state.stats.tradesNarrated;
    document.getElementById('session-pnl').textContent = 
      `$${this.state.stats.profitLoss >= 0 ? '+' : ''}${this.state.stats.profitLoss.toFixed(2)}`;
    document.getElementById('whales-tracked').textContent = 
      Object.keys(this.state.whaleActivity).length;
  }
  
  updatePoolTotals() {
    let totalValue = 0;
    let totalPerformance = 0;
    let activePools = 0;
    
    document.querySelectorAll('.pool-card').forEach(card => {
      const balance = parseFloat(card.querySelector('.pool-balance').textContent.replace('$', ''));
      const performance = parseFloat(card.querySelector('.pool-performance').textContent.replace('%', ''));
      
      totalValue += balance;
      totalPerformance += performance;
      
      if (card.querySelector('.pool-toggle').classList.contains('active')) {
        activePools++;
      }
    });
    
    document.getElementById('total-pool-value').textContent = `$${totalValue.toFixed(2)}`;
    document.getElementById('total-performance').textContent = 
      `${totalPerformance >= 0 ? '+' : ''}${(totalPerformance / 4).toFixed(2)}%`;
    document.getElementById('active-pools').textContent = activePools;
  }
  
  async updateRealTimeStats() {
    // Update session time
    const sessionTime = Date.now() - this.state.stats.startTime;
    // Update other real-time metrics
  }
  
  async fetchWhaleUpdates() {
    try {
      const response = await fetch(`${this.config.apiUrl}/whales/status`);
      const data = await response.json();
      
      if (data.recentTrades) {
        // Process new whale trades
        data.recentTrades.forEach(trade => {
          if (!this.state.whaleActivity.find(t => t.id === trade.id)) {
            this.handleWhaleTrade(trade);
          }
        });
      }
    } catch (error) {
      console.error('[MoverUI] Failed to fetch whale updates:', error);
    }
  }
  
  handleBotEvent(event) {
    // Handle events from the main trading bot
    if (event.type === 'trade') {
      // Extract P&L if present
      const match = event.data.result?.match(/([+-]\$[\d,]+\.?\d*)/);
      if (match) {
        const pnl = parseFloat(match[1].replace(/[$,]/g, ''));
        this.state.stats.profitLoss += pnl;
        this.updateStats();
      }
    }
  }
}

// Initialize when DOM is ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => {
    window.moverUI = new MoverFrontend('mover-container');
  });
} else {
  window.moverUI = new MoverFrontend('mover-container');
}

</script>
